name: Synthetic native tests
on: [pull_request, push, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test native core with synthetic data
        run: cargo test --manifest-path native/Cargo.toml --locked
# Java requires local third-party JARs; see docs/BUILD.md.
# This workflow does not distribute the game-data preview.
