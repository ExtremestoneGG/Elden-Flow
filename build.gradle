plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"eldensteve" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
    modImplementation files('libs/modmenu-11.0.5.jar')
    // Vulkan is the requested default for the local test profile.
        modRuntimeOnly files('../../Research/vulkan/VulkanMod-0.6.7+1.21.1.jar')
        modRuntimeOnly fileTree(dir: '../../Research/vulkan/nested', include: ['*.jar'])
    modImplementation fileTree(dir: 'libs/swords', include: ['*.jar','nested/*.jar'])
    modImplementation files('libs/controlify-2.4.4+1.21.1-fabric.jar')
    modImplementation fileTree(dir: 'libs/controlify-deps', include: ['*.jar'])
    implementation 'net.java.dev.jna:jna:5.14.0'
    include 'net.java.dev.jna:jna:5.14.0'
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:1.21.1+build.3:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from('native/UPSTREAM-LICENSE.md')
    from('NOTICE.md')
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

tasks.register('writeRigCheckClasspath') {
    doLast {
        file('../../Cache/rig-classpath.txt').text = sourceSets.client.runtimeClasspath.asPath
    }
}
tasks.register('exportPrototypeLaunch') {
    dependsOn 'configureClientLaunch'
    doLast {
        def run = tasks.named('runClient').get()
        file('../../Cache/prototype-launch.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
            main: run.mainClass.get(), classpath: run.classpath.asPath,
            jvm: run.allJvmArgs, args: run.args, directory: run.workingDir.absolutePath
        ]))
    }
}


loom {
    runs {
        client {
            runDir '../../Minecraft-Dev'
            vmArg '-Xmx3G'
            vmArg '-Djava.io.tmpdir=D:/EldenMinecraftProject/Cache/temp'
            programArgs '--width', '960', '--height', '600'
        }
    }
}
